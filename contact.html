    <main>
      <section class="mt-10 mb-10">
        <div class="container">
          <div class="row">
            <div class="md:col-6 border border-primary p-10">
              <h1>Contact Form</h1>
              <form class="row">
                <div class="md:col-6">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" placeholder="Enter Name">
                </div>
                <div class="md:col-6">
                  <label for="surname" class="form-label">Surname</label>
                  <input type="text" class="form-control" id="surname" placeholder="Enter Surname">
                </div>
                <div class="md:col-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter Email">
                </div>
                <div class="md:col-6">
                  <label for="phone" class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" placeholder="Enter Phone Number">
                </div>
                <div class="md:col-4">
                  <div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">Country</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Choose one…</option>
    <option value="1">India</option>
    <option value="2">USA</option>
    <option value="3">UK</option>
  </select>
</div>
                </div>
                <div class="md:col-4">
                  <div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">State</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Choose one…</option>
    <option value="1">Maharashtra</option>
    <option value="2">California</option>
    <option value="3">London</option>
  </select>
</div>
                </div>
                <div class="md:col-4">
                  <div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">City</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Choose one…</option>
    <option value="1">Pune</option>
    <option value="2">Nagpur</option>
    <option value="3">Mumbai</option>
  </select>
</div>
                </div>
                <div class="mg:col-6"><label for="datepicker1" class="form-label">DOB</label>
<input type="text" class="form-control w-100" id="datepicker1" data-bs-toggle="datepicker" autocomplete="off" placeholder="Choose date…">  </div>
                <div class="mg:col-6">
                  <label for="datepicker1" class="form-label">DOJ</label>
<input type="text" class="form-control w-100" id="datepicker1" data-bs-toggle="datepicker" autocomplete="off" placeholder="Choose date…">
                </div>
                <div class="md:col-12">
                  <label for="message" class="form-label">Enter Comments</label>
                  <textarea class="form-control" id="message" rows="3" placeholder="Enter Message"></textarea>
                </div>
                <div class="md:col-6 mt-2">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>

              </form>
            </div>
            <div class="md:col-6">

              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60472.14684944339!2d73.71268272399904!3d18.68600864851843!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2b0cb0583ff21%3A0xa66887d5d07bcef5!2sDehu%20Road%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1795109672742!5m2!1sen!2sin" width="100%" height="650" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            </div>
            <div class="md:col-4 border-end padding">

            </div>
            <div class="md:col-4 padding">

              <a
                href="https://www.youtube.com/"
                target="_blank"><i class="bi bi-youtube social m-6"></i>
                
              </a>

                href="https://www.github.com/"
                target="_blank"><i class="bi bi-github social m-6"></i>
              
              </a>
